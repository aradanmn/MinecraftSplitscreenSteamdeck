# CI — shellcheck + the existing bash unit-test suites.
#
# This is the project's first CI gate (previously: only a release-asset upload on tag
# push, nothing ran shellcheck or tests/ on push/PR — see the codebase review, 2026-07-01).
#
# Design notes:
#   - shellcheck: gated on ERROR severity only (0 pre-existing errors, verified). There
#     are ~56 pre-existing WARNING-level findings across the modules; fixing those is real
#     cleanup work or a separate pass, not something to silently gate on here — they're
#     reported (informational, non-blocking) so they're visible without turning CI red on
#     day one for pre-existing debt unrelated to a given change.
#   - tests/test_*.sh: every suite prints "X/Y tests passed." and exits non-zero when
#     any sub-test failed, so the gate is the EXIT STATUS of every suite found by glob —
#     a new suite is gated the day it lands, and a suite cannot pass by printing a big
#     enough X (the previous per-suite BASELINE pass-count gate let test_uhid_pad.sh lose
#     5 of 23 tests with CI green, and ignored a suite that recorded [FAIL] lines but
#     still printed a full count — codebase review 2026-09-28, F2/T5/T6/T23). Suites that
#     are known-red today are listed in KNOWN_FAIL with the exact summary they must
#     print; any other number fails the build, and the entry is deleted when the gap
#     closes. tests/test_installer.sh is gated too: since T7.7 stubs every module it is
#     network-free.
#   - Hardware/session-dependent scripts (tests/test_phase_b_lifecycle.sh, tests/kwin-*.sh,
#     tests/gamescope-*.sh, tests/wintree-capture.sh, tests/window-pos-test.sh,
#     tests/ssh-override-redirect-test.sh, tests/diagnose.sh, tests/hardware/) require a
#     live X11/KWin/gamescope session and are NOT run here — they stay Deck-only per the
#     project's existing "nothing is done until maintainer-confirmed on the Deck" rule.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      - name: shellcheck (error severity — gates the build)
        run: |
          shellcheck -S error modules/*.sh minecraftSplitscreen.sh install-minecraft-splitscreen.sh

      - name: shellcheck (warning severity — informational only)
        if: always()
        run: |
          shellcheck -S warning modules/*.sh minecraftSplitscreen.sh install-minecraft-splitscreen.sh || true

  unit-tests:
    runs-on: ubuntu-latest
    # A hung suite must fail this job, not burn the 6 h default (PRINCIPLES #6/#8).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies (jq)
        run: sudo apt-get update -qq && sudo apt-get install -y jq

      - name: Run every CI-safe test suite and gate on exit status
        run: |
          set -u
          fail=0

          # Suites that need a live Deck session — never run here.
          declare -A SKIP=(
            [tests/test_phase_b_lifecycle.sh]="needs a live nested-KDE/gamescope session and real instances"
          )
          # Suites that are KNOWN red today, with the EXACT summary they must print.
          # Fewer passes or a changed total fails the build; delete the entry (and
          # let the exit status gate it) when the gap is closed.
          declare -A KNOWN_FAIL=(
            # (empty since #204 fixed test_window_manager.sh; add entries as
            #  [tests/test_x.sh]="7/9"  # why, and which issue closes it)
          )
          # Per-suite wall-clock bound: test_evsieve_management.sh takes ~2 min
          # (it symlinks /usr/bin into an isolated PATH); everything else is seconds.
          SUITE_TIMEOUT=600

          for suite in tests/test_*.sh; do
            if [[ -n "${SKIP[$suite]:-}" ]]; then
              echo "=== $suite — skipped (${SKIP[$suite]})"
              continue
            fi
            echo "=== $suite"
            # Output goes to a FILE, not a $(...) capture: an orphaned background
            # process holding a capture pipe blocks the whole step forever (#80/#103).
            log="$RUNNER_TEMP/$(basename "$suite" .sh).log"
            rc=0
            timeout --kill-after=10 "$SUITE_TIMEOUT" bash "$suite" </dev/null >"$log" 2>&1 || rc=$?
            cat "$log"
            summary=$(grep -oE '^[0-9]+/[0-9]+ tests passed' "$log" | tail -1 | grep -oE '^[0-9]+/[0-9]+')
            if [[ -z "$summary" ]]; then
              echo "::error::$suite printed no 'X/Y tests passed' summary (exit $rc) — it crashed, hung (timeout exits 124), or is not a standard suite"
              fail=1
              continue
            fi
            if [[ -n "${KNOWN_FAIL[$suite]:-}" ]]; then
              if [[ "$summary" == "${KNOWN_FAIL[$suite]}" ]]; then
                echo "KNOWN-FAIL (unchanged): $suite $summary (exit $rc)"
              else
                echo "::error::$suite printed $summary but KNOWN_FAIL expects exactly ${KNOWN_FAIL[$suite]} — update the entry deliberately (or delete it once the suite is green)"
                fail=1
              fi
              continue
            fi
            if (( rc != 0 )); then
              echo "::error::$suite failed: exit $rc, $summary"
              fail=1
            else
              echo "OK: $suite $summary"
            fi
          done

          exit "$fail"
